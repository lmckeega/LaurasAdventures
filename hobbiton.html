<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Story Name - Laura's Adventures</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="/navigation.css">
	<link rel="stylesheet" href="/content-layouts.css">
	<link rel="stylesheet" href="/lightbox.css">

	<script src="/navigation.js" defer></script>
	<script src="/lightbox.js" defer></script>

</head>


<body class="story-page">

    <!-- Shared website navigation -->
    <div id="global-navigation-hub"></div>

    <h1>Story Name</h1>

	//* Page Content Starts *//
	<p>
		Add content
	</p>

	//* Page Content Starts *//

	
	<h2>Photo Gallery</h2>

	<div class="story-gallery" id="knifeGallery">

		<button type="button">
			<img src="/images/travels/newzealand/making-knives/knife.jpg"
				 alt="Knife Progression" loading="lazy">
		</button>

		<button type="button">
			<img src="/images/travels/newzealand/making-knives/IMGP0408.JPG"
				 alt="Cristina" loading="lazy">
		</button>

		<button type="button">
			<img src="/images/travels/newzealand/making-knives/IMGP0419.JPG"
				 alt="Pounding the hot metal" loading="lazy">
		</button>
	</div>
	
	<div id="myLightbox" class="lightbox"
		 role="dialog" aria-modal="true"
		 aria-label="Photo viewer">

		<span class="close-btn"
			  onclick="closeLightbox()">&times;</span>

		<span class="nav-btn prev-btn"
			  onclick="changeImage(-1)">&#10094;</span>

		<span class="nav-btn next-btn"
			  onclick="changeImage(1)">&#10095;</span>

		<img id="lightboxImg"
			 class="lightbox-content"
			 src="" alt="Active photo">

		<div class="lightbox-caption">
			<div id="captionTitle" class="caption-title"></div>
			<div id="captionDesc" class="caption-desc"></div>
		</div>
	</div>

<script>
	document.addEventListener('DOMContentLoaded', function () {

		const buttons =
			Array.from(document.querySelectorAll(
				'#knifeGallery button'
			));

		const photos = buttons.map(button => {
			const img = button.querySelector('img');

			return {
				src: img.getAttribute('src'),
				title: img.alt,
				desc: img.dataset.caption || ''
			};
		});

		setLightboxImages(photos);

		buttons.forEach((button, index) => {
			button.addEventListener('click', () => {
				openLightbox(index);
			});
		});

	});
	</script>

</body>
</html>
