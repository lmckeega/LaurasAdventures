<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura's Adventures - Photo Gallery</title>
    <style>
        /* --- GLOBAL PALETTE & RESET --- */
        body {
            background-image: url('images/grass-bg.jpg');
            background-size: cover;       /* Ensures it fills the screen perfectly */
            background-position: center;  /* Centers the grass texture */
            background-attachment: fixed;  /* Keeps it fixed while scrolling (like Wix) */
            background-color: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 40px 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #e5e5e5;
        }

        /* --- THE HONEYCOMB HEX GRID --- */
        .hex-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding-top: 0px; 
        }

        /* --- DEFAULT DESKTOP SIZES (5 and 4 wide) --- */
        :root {
            --hex-w: 200px;
            --hex-h: 226px;
            --hex-img-w: 192px;
            --hex-img-h: 218px;
            --hex-row-margin: -54px;
        }

        /* --- MOBILE & TABLET SIZES (Dynamically activated) --- */
        @media (max-width: 768px) {
            :root {
                --hex-w: min(30vw, 130px);
                --hex-h: calc(var(--hex-w) * 1.13);
                --hex-img-w: calc(var(--hex-w) - 6px);
                --hex-img-h: calc(var(--hex-h) - 6px);
                --hex-row-margin: calc(var(--hex-h) * -0.24);
            }
            body {
                padding: 20px 5px;
            }
            h1 {
                font-size: 1.8rem;
                margin-bottom: 30px;
            }
            .hex-grid {
                padding-top: 0px; /* Less spacing needed for the shorter mobile menu */
            }
        }

        .hex-row {
            display: flex;
            justify-content: center;
            margin-bottom: var(--hex-row-margin); /* Pulls rows tightly vertical to lock shapes */
        }

        .hex-border {
            width: var(--hex-w);
            height: var(--hex-h);
            background-color: rgba(255, 255, 255, 0.85); /* Clean white lines */
            margin: 0 -2px; /* Moves shapes horizontally to overlap edges completely */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease, background-color 0.25s ease;
        }

        /* Premium hover lift like Wix */
        .hex-border:hover {
            transform: scale(1.06);
            background-color: #ffffff;
            z-index: 10;
            cursor: pointer;
        }

        .hex-item {
            width: var(--hex-img-w);
            height: var(--hex-img-h);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            overflow: hidden;
            background-color: #1a1a1a;
        }

        .hex-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Centers & scales your shapes without stretching */
        }


        /* --- RESPONSIVE FALLBACKS FOR MOBILE SCREENS --- */
        @media (max-width: 768px) {
            .hex-row {
                flex-wrap: nowrap;
                margin-bottom: var(--hex-row-margin);
            }

            .hex-border {
                margin: 0 -2px;
                flex-shrink: 0;
            }
        }


    </style>
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="lightbox.css">
    <script src="navigation.js" defer></script>
    <script src="lightbox.js" defer></script>
</head>
<body>
    <!-- THE AUTOMATIC MENU PLACEHOLDER -->
    <div id="global-navigation-hub"></div>



    <h1>Laura's Adventures</h1>

    <!-- Handled automatically via JSON runtime loop injections -->
    <div id="hexGrid" class="hex-grid"></div>

    <!-- LIGHTBOX MODAL ELEMENT CONTAINER STRUCTURE -->
    <div id="myLightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <span class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</span>
        <span class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</span>
        
        <img id="lightboxImg" class="lightbox-content" src="" alt="Active View">
        
        <div class="lightbox-caption">
            <div id="captionTitle" class="caption-title"></div>
            <div id="captionDesc" class="caption-desc"></div>
        </div>
    </div>

    <script>
        let galleryData = [];
        
        // 1. DYNAMIC DATA FETCH LOADER
        fetch('bugs-data.json')
            .then(response => {
                if (!response.ok) throw new Error("JSON metadata tracking ledger could not resolve.");
                return response.json();
            })
            .then(data => {
                galleryData = data;
                setLightboxImages(galleryData);
                buildHexagonHoneycombGrid();
            })
            .catch(err => console.error("Error structuralizing gallery components:", err));

        // 2. ALTERNATING MULTI-ROW STRUCTURAL BUILDER (5 items, then 4 items, etc.)
        function buildHexagonHoneycombGrid() {
            const container = document.getElementById('hexGrid');
            container.innerHTML = ""; // Clear out previous layout if window resizes
            let activeRowElement;
            
            // Check window width. If under 768px, use 3 and 2 items per row. Otherwise use 5 and 4.
            const isMobile = window.innerWidth <= 768;
            const patternLayoutSequence = isMobile ? [3, 2] : [5, 4];
            
            let layoutSequenceIndex = 0;
            let currentBuiltItemsInRow = 0;

            galleryData.forEach((photoObj, index) => {
                if (currentBuiltItemsInRow === 0) {
                    activeRowElement = document.createElement('div');
                    activeRowElement.className = 'hex-row';
                    container.appendChild(activeRowElement);
                }

                const hexNodeHTML = `
                    <div class="hex-border" onclick="openLightbox(${index})">
                        <div class="hex-item">
                            <img src="${photoObj.src}" alt="${photoObj.title}" loading="lazy">
                        </div>
                    </div>
                `;
                activeRowElement.innerHTML += hexNodeHTML;
                currentBuiltItemsInRow++;

                // If row limit reached, loop sequence back between alternating row capacities
                if (currentBuiltItemsInRow === patternLayoutSequence[layoutSequenceIndex]) {
                    currentBuiltItemsInRow = 0;
                    layoutSequenceIndex = (layoutSequenceIndex + 1) % patternLayoutSequence.length;
                }
            });
        }

        // Automatically recalculate grid layout if a tablet or mobile screen rotates sideways
        window.addEventListener('resize', buildHexagonHoneycombGrid);



    </script>

</body>
</html>
