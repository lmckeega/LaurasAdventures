<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura's Adventures - Photo Gallery</title>
    <style>
        /* --- GLOBAL PALETTE & RESET --- */
        body {
            background-image: url('images/grass-bg.jpg');
            background-size: cover;       /* Ensures it fills the screen perfectly */
            background-position: center;  /* Centers the grass texture */
            background-attachment: fixed;  /* Keeps it fixed while scrolling (like Wix) */
            background-color: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 40px 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 50px;
            color: #e5e5e5;
        }

        /* --- THE HONEYCOMB HEX GRID --- */
        .hex-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hex-row {
            display: flex;
            justify-content: center;
            margin-bottom: -54px; /* Pulls rows tightly vertical to lock shapes */
        }

        .hex-border {
            width: 200px;
            height: 226px;
            background-color: rgba(255, 255, 255, 0.85); /* Clean white lines */
            margin: 0 -2px; /* Moves shapes horizontally to overlap edges completely */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease, background-color 0.25s ease;
        }

        /* Premium hover lift like Wix */
        .hex-border:hover {
            transform: scale(1.06);
            background-color: #ffffff;
            z-index: 10;
            cursor: pointer;
        }

        .hex-item {
            width: 192px; /* Reveals a thin 4px matching border boundary */
            height: 218px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            overflow: hidden;
            background-color: #1a1a1a;
        }

        .hex-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Centers & scales your shapes without stretching */
        }

        /* --- INTERACTIVE WIX-STYLE LIGHTBOX MODAL --- */
        .lightbox {
            display: none; /* Initially hidden */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 11, 14, 0.95); /* Deep dark fade out background */
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox-content {
            max-width: 85%;
            max-height: 70%;
            border: 4px solid #1f2833;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 2px;
        }

        /* Pop-up dynamic typography */
        .lightbox-caption {
            margin-top: 20px;
            text-align: center;
            max-width: 80%;
        }

        .caption-title {
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .caption-desc {
            font-size: 1.1rem;
            color: #9c9c9c;
            font-weight: 300;
        }

        /* CONTROLS (Arrows & Close) */
        .close-btn {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 45px;
            color: #666;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #fff; }

        .nav-btn {
            position: absolute;
            font-size: 55px;
            color: #555;
            cursor: pointer;
            user-select: none;
            top: 50%;
            transform: translateY(-50%);
            padding: 20px;
            transition: color 0.2s;
        }
        .nav-btn:hover { color: #fff; }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        /* --- RESPONSIVE FALLBACKS FOR MOBILE SCREENS --- */
        @media (max-width: 768px) {
            .hex-row {
                flex-wrap: wrap;
                margin-bottom: 0; /* Drop the layout nesting overlay on mobile rows */
            }
            .hex-border {
                margin: 10px; /* Separates them cleanly down standard scrolling viewports */
            }
            .nav-btn { font-size: 40px; padding: 10px; }
            .prev-btn { left: 5px; }
            .next-btn { right: 5px; }
        }
    </style>
</head>
<body>

    <h1>Laura's Adventures</h1>

    <!-- Handled automatically via JSON runtime loop injections -->
    <div id="hexGrid" class="hex-grid"></div>

    <!-- LIGHTBOX MODAL ELEMENT CONTAINER STRUCTURE -->
    <div id="myLightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <span class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</span>
        <span class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</span>
        
        <img id="lightboxImg" class="lightbox-content" src="" alt="Active View">
        
        <div class="lightbox-caption">
            <div id="captionTitle" class="caption-title"></div>
            <div id="captionDesc" class="caption-desc"></div>
        </div>
    </div>

    <script>
        let galleryData = [];
        let currentIndex = 0;

        // 1. DYNAMIC DATA FETCH LOADER
        fetch('gallery-data.json')
            .then(response => {
                if (!response.ok) throw new Error("JSON metadata tracking ledger could not resolve.");
                return response.json();
            })
            .then(data => {
                galleryData = data;
                buildHexagonHoneycombGrid();
            })
            .catch(err => console.error("Error structuralizing gallery components:", err));

        // 2. ALTERNATING MULTI-ROW STRUCTURAL BUILDER (5 items, then 4 items, etc.)
        function buildHexagonHoneycombGrid() {
            const container = document.getElementById('hexGrid');
            let activeRowElement;
            
            const patternLayoutSequence =[5,4]; 
            let layoutSequenceIndex = 0;
            let currentBuiltItemsInRow = 0;

            galleryData.forEach((photoObj, index) => {
                if (currentBuiltItemsInRow === 0) {
                    activeRowElement = document.createElement('div');
                    activeRowElement.className = 'hex-row';
                    container.appendChild(activeRowElement);
                }

                // Inject dynamic click tracking using array positions
                const hexNodeHTML = `
                    <div class="hex-border" onclick="openLightbox(${index})">
                        <div class="hex-item">
                            <img src="${photoObj.src}" alt="${photoObj.title}" loading="lazy">
                        </div>
                    </div>
                `;
                activeRowElement.innerHTML += hexNodeHTML;
                currentBuiltItemsInRow++;

                // If row limit reached, loop sequence back between rows of 5 and 4
                if (currentBuiltItemsInRow === patternLayoutSequence[layoutSequenceIndex]) {
                    currentBuiltItemsInRow = 0;
                    layoutSequenceIndex = (layoutSequenceIndex + 1) % patternLayoutSequence.length;
                }
            });
        }

        // 3. EVENT SYSTEM & INTERACTIVE VIEWER CONTROLLER
        function openLightbox(index) {
            currentIndex = index;
            renderLightboxSnapshot();
            document.getElementById("myLightbox").style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("myLightbox").style.display = "none";
        }

        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex >= galleryData.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = galleryData.length - 1;
            renderLightboxSnapshot();
        }

        function renderLightboxSnapshot() {
            const activePhoto = galleryData[currentIndex];
            document.getElementById("lightboxImg").src = activePhoto.src;
            document.getElementById("captionTitle").innerText = activePhoto.title;
            document.getElementById("captionDesc").innerText = activePhoto.desc;
        }

        // 4. DESKTOP KEYBOARD UTILITIES (Escape, Arrow Left, Arrow Right)
        document.addEventListener('keydown', function(event) {
            const isModalOpen = document.getElementById("myLightbox").style.display === "flex";
            if (!isModalOpen) return;

            if (event.key === "Escape") closeLightbox();
            if (event.key === "ArrowRight") changeImage(1);
            if (event.key === "ArrowLeft") changeImage(-1);
        });
    </script>

</body>
</html>
