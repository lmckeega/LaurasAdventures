<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura's Adventures - Welcome</title>
    <style>
        /* --- RESET & STRUCTURE --- */
        * {
            box-sizing: border-box;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevents scrollbars on the full-screen view */
            background-color: #000;
        }

        /* --- FULL SCREEN BACKGROUND SLIDER --- */
        .slider-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* Controls the crossfade speed */
        }

        /* The active class triggered by JS to bring an image forward */
        .slide.active {
            opacity: 1;
        }

        /* Subtle dark overlay so your text is easily readable over any photo color */
        .slider-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        /* --- FOREGROUND CONTENT LAYER --- */
        .content-layer {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        p {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #e5e5e5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* --- STYLISH NAVIGATION BUTTON --- */
        .enter-btn {
            display: inline-block;
            padding: 14px 36px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: none;
            border: 2px solid #ffffff;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .enter-btn:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Mobile responsiveness adjustment */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            p { font-size: 1rem; }
            .enter-btn { padding: 12px 28px; font-size: 1rem; }
        }


        /* --- MOBILE HOME PAGE SLIDESHOW --- */
        @media (max-width: 768px) {

            .slide {
                overflow: hidden;
            }

            /* Blurred full-screen copy of photo */
            .slide::before {
                content: "";
                position: absolute;
                inset: -30px;
                background-image: inherit;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                filter: blur(22px) brightness(0.7);
            }

            /* Sharp, complete photo in foreground */
            .slide::after {
                content: "";
                position: absolute;
                inset: 0;
                background-image: inherit;
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;
            }
        }



    </style>
    <link rel="stylesheet" href="navigation.css">
    <script src="navigation.js" defer></script>
</head>
<body>

    <!-- THE AUTOMATIC MENU PLACEHOLDER -->
    <div id="global-navigation-hub"></div>



    <!-- BACKGROUND IMAGES (Populated dynamically by JavaScript) -->
    <div id="slider" class="slider-container"></div>
    <div class="slider-overlay"></div>

    <!-- FOREGROUND TEXT AND BUTTON -->


    <script>
        // Set rotation timer: 5000 milliseconds = 5 seconds per slide
        const slideIntervalTime = 5000; 
        
        let slideImages = []; // Starts empty, populated by home.json
        let currentSlideIndex = 0;
        let slides = [];

        // 1. DYNAMIC DATA FETCH LOADER
        fetch('home.json')
            .then(response => {
                if (!response.ok) throw new Error("JSON slider configuration could not resolve.");
                return response.json();
            })
            .then(data => {
                slideImages = data;
                buildSlider();
            })
            .catch(err => console.error("Error loading home page slider:", err));

        // 2. GENERATE SLIDE DIV ELEMENTS DYNAMICALLY
        function buildSlider() {
            const sliderContainer = document.getElementById('slider');

            slideImages.forEach((imageSrc, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                if (index === 0) slideDiv.className += ' active'; // First image starts visible
                slideDiv.style.backgroundImage = `url('${imageSrc}')`;
                sliderContainer.appendChild(slideDiv);
            });

            // Gather the freshly created elements into our global tracker array
            slides = document.querySelectorAll('.slide');
            
            // Only start the rotation animation if we have more than one slide image
            if (slides.length > 1) {
                startSlideShow();
            }
        }

        // 3. SLIDER ROTATION ENGINE
        function startSlideShow() {
            setInterval(() => {
                // Remove active class from current image
                slides[currentSlideIndex].classList.remove('active');
                
                // Calculate next slide index (loops back to zero seamlessly)
                currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                
                // Add active class to next image
                slides[currentSlideIndex].classList.add('active');
            }, slideIntervalTime);
        }

    </script>

</body>
</html>
