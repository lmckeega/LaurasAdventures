<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Hexagon Photo Gallery</title>
    <style>
        body {
            background: linear-gradient(to right, #a8e063, #56ab2f); /* Blurred green background like your Wix image */
            margin: 0;
            padding: 40px;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
        }

        /* The container holding the grid */
        .hex-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1200px;
        }

        /* A row of hexagons */
        .hex-row {
            display: flex;
            justify-content: center;
            margin-bottom: -56px; /* Pulls the next row up to lock perfectly */
        }

        /* The white border frame around each hexagon */
        .hex-border {
            width: 200px;
            height: 226px;
            background-color: white;
            margin: 0 -2px; /* Pulls them side-to-side so the borders overlap completely */
            /* Creates the 6-sided polygon clip */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        /* Subtle lift effect so you know which image you are hovering on */
        .hex-border:hover {
            transform: scale(1.05);
            z-index: 10;
            cursor: pointer;
        }

        /* The actual image container inside the white border */
        .hex-item {
            width: 190px; /* Leave a clean, consistent white line */
            height: 216px;
            background-color: #333;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            overflow: hidden;
        }

        /* Ensures the image fills the hexagon perfectly without distorting */
        .hex-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="hex-grid">
        
        <!-- ROW 1 (5 Hexagons) -->
        <div class="hex-row">
            <div class="hex-border"><div class="hex-item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgYzbkOUsa1rTjgefgLGF0gR3pqsTY2GDUOHx6_GDKQ&s=10" alt="Spider"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgYzbkOUsa1rTjgefgLGF0gR3pqsTY2GDUOHx6_GDKQ&s=10" alt="Web"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgYzbkOUsa1rTjgefgLGF0gR3pqsTY2GDUOHx6_GDKQ&s=10" alt="Dragonfly"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://picsum.photos" alt="Bug"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://picsum.photos" alt="Termites"></div></div>
        </div>

        <!-- ROW 2 (4 Hexagons - Offsets automatically due to the math) -->
        <div class="hex-row">
            <div class="hex-border"><div class="hex-item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgYzbkOUsa1rTjgefgLGF0gR3pqsTY2GDUOHx6_GDKQ&s=10" alt="Bird"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgYzbkOUsa1rTjgefgLGF0gR3pqsTY2GDUOHx6_GDKQ&s=10" alt="Fish"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://picsum.photos" alt="Caterpillar"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://picsum.photos" alt="Kitten"></div></div>
        </div>

        <!-- ROW 3 (5 Hexagons) -->
        <div class="hex-row">
            <div class="hex-border"><div class="hex-item"><img src="https://picsum.photos0" alt="Insect"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://picsum.photos1" alt="Frog"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://picsum.photos2" alt="Fly"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://picsum.photos3" alt="Crab"></div></div>
            <div class="hex-border"><div class="hex-item"><img src="https://picsum.photos4" alt="Wasp"></div></div>
        </div>

    </div>

</body>
</html>
