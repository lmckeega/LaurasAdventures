<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Story Name - Laura's Adventures</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="/navigation.css">
	<link rel="stylesheet" href="/content-layouts.css">
	<link rel="stylesheet" href="/lightbox.css">

	<script src="/navigation.js" defer></script>
	<script src="/lightbox.js" defer></script>
	<script src="/story-gallery.js" defer></script>

</head>


<body class="story-page">
	
	<!-- ======================================================
     STORY PAGE STARTER — EDITING CHECKLIST

     1. Change the <title> in the HEAD section.
     2. Change the <h1> page heading.
     3. Replace the story paragraphs.
     4. Add photographs in the PHOTO GALLERY section.
     5. Change each photo's filename, title and caption.
     6. Adjust object-position if thumbnail cropping
        cuts off an important part of the photograph.

     DO NOT CHANGE:
     - storyGallery ID
     - myLightbox ID
     - Shared navigation and lightbox JavaScript
     ====================================================== -->

    <!-- Shared website navigation -->
    <div id="global-navigation-hub"></div>

	<main id="page-content">
		<h1>Story Name</h1>

		<!-- Page Content Starts -->
		<p>
			Add content
		</p>

		<!-- Page Content Ends -->

		<!-- Clear floating photos so the gallery starts below them -->
		<div style="clear: both;"></div>
		
		<!-- =====================================================
		 PHOTO GALLERY — START
		 Add, remove, or rearrange photographs here.
		 Change object-position to adjust thumbnail cropping.
		 ===================================================== -->

		<h2>Photo Gallery</h2>

		<div class="story-gallery" id="storyGallery">

			<!-- PHOTO 1 -->
			<button type="button">
				<img src="/images/travels/newzealand/hobbiton/IMG_0706.JPG"
					 alt="All in a day's work"
					 data-caption=""
					 style="object-position: center center;"
					 loading="lazy">
			</button>

			<!-- PHOTO 2 -->
			<button type="button">
				<img src="/images/travels/newzealand/hobbiton/DSCN3782.JPG"
					 alt="Cristina in front of her hobbit hole"
					 data-caption=""
					 style="object-position: center center;"
					 loading="lazy">
			</button>

			<!-- ADD MORE PHOTOGRAPHS HERE -->

		</div>

		<!-- PHOTO GALLERY — END -->

	</main>	
	
	<!-- =====================================================
     SHARED LIGHTBOX — DO NOT MODIFY

     This viewer works with:
       lightbox.css
       lightbox.js
       story-gallery.js

     All story pages use the same lightbox HTML.
     The photo information comes from storyGallery above.
     ===================================================== -->
	
	<div id="myLightbox" class="lightbox"
		 role="dialog" aria-modal="true"
		 aria-label="Photo viewer">

		<span class="close-btn"
			  onclick="closeLightbox()">&times;</span>

		<span class="nav-btn prev-btn"
			  onclick="changeImage(-1)">&#10094;</span>

		<span class="nav-btn next-btn"
			  onclick="changeImage(1)">&#10095;</span>

		<img id="lightboxImg"
			 class="lightbox-content"
			 src="" alt="Active photo">

		<div class="lightbox-caption">
			<div id="captionTitle" class="caption-title"></div>
			<div id="captionDesc" class="caption-desc"></div>
		</div>
	</div>
</body>
</html>
